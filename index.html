<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jupiter Cyber Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 40px 24px;
    }

    /* --- Logo wrapper --- */
    .logo {
      animation: pulse 4s ease-in-out 3.5s infinite;
    }

    .logo svg {
      width: clamp(100px, 30vw, 140px);
      height: auto;
    }

    /* --- Typography --- */
    .company-name {
      color: #f0f0f2;
      font-size: clamp(12px, 4vw, 19px);
      font-weight: 200;
      letter-spacing: clamp(3px, 1.2vw, 6px);
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: fade-up 0.6s ease-out 2.3s both;
    }

    .tagline {
      color: #8a8aa0;
      font-size: clamp(9px, 2.5vw, 12px);
      font-weight: 300;
      letter-spacing: clamp(2px, 0.8vw, 3px);
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: fade-up 0.6s ease-out 2.6s both;
    }

    .divider {
      display: block;
      border: none;
      width: 40px;
      height: 1px;
      background: rgba(255, 255, 255, 0.12);
      margin: 4px 0;
      opacity: 0;
      animation: fade-in 0.5s ease-out 2.9s both;
    }

    .email {
      opacity: 0;
      animation: fade-up 0.6s ease-out 3.1s both;
    }

    .email a {
      color: #5e7ea1;
      font-size: clamp(10px, 2.5vw, 12px);
      font-weight: 300;
      letter-spacing: 2px;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .email a:hover {
      color: #8aade0;
    }

    /* --- SVG element animations --- */
    #logo-rect {
      stroke-dasharray: 223;
      stroke-dashoffset: 223;
      animation: draw 1.2s ease-out forwards;
    }

    #logo-path {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: draw 1.0s ease-out 0.8s forwards;
    }

    #dot-large,
    #dot-medium,
    #dot-small {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }

    #dot-large  { animation: fade-scale 0.4s ease-out 1.5s both; }
    #dot-medium { animation: fade-scale 0.4s ease-out 1.8s both; }
    #dot-small  { animation: fade-scale 0.4s ease-out 2.1s both; }

    /* --- Keyframes --- */
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    @keyframes fade-scale {
      from {
        opacity: 0;
        transform: scale(0.4);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.02); }
    }
  </style>
</head>
<body>
  <div class="content">

    <div class="logo">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="-0.5 -0.5 59 60"
        aria-label="Jupiter Cyber Solutions Logo"
        role="img"
      >
        <!-- Outer square frame -->
        <rect
          id="logo-rect"
          x="1.3"
          y="1.4"
          width="55.0"
          height="56.1"
          fill="none"
          stroke="#e0e0e0"
          stroke-width="2.7"
          stroke-linecap="square"
          stroke-linejoin="miter"
        />
        <!-- Curved arc (bottom-left to top-right) -->
        <path
          id="logo-path"
          d="M 7.3,46.0 C 7.3,46.0 21.5,45.5 33.9,35.4 C 46.2,25.3 50.8,11.3 50.8,11.3"
          fill="none"
          stroke="#e0e0e0"
          stroke-width="2.6"
          stroke-linecap="round"
        />
        <!-- Three dots of decreasing size along the arc -->
        <ellipse id="dot-large"  cx="15.8" cy="47.9" rx="2.8" ry="3.0" fill="#e0e0e0" />
        <ellipse id="dot-medium" cx="32.8" cy="35.7" rx="2.4" ry="2.6" fill="#e0e0e0" />
        <ellipse id="dot-small"  cx="44.2" cy="19.6" rx="1.5" ry="1.6" fill="#e0e0e0" />
      </svg>
    </div>

    <p class="company-name">Jupiter Cyber Solutions</p>
    <p class="tagline">IT effizienter. Sicherer. Smarter.</p>
    <hr class="divider">
    <p class="email"><a href="mailto:thomas@jupcs.de">thomas@jupcs.de</a></p>

  </div>
</body>
</html>
